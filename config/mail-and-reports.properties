# =====================================================================
# Suma Tracking - EMAIL and REPORTS settings
# ---------------------------------------------------------------------
# You can change this file any time. The backend reads it again by itself
# within 1 minute (no restart needed).
# Lines that start with # are notes and are ignored.
#
# NEVER write the email PASSWORD in this file. It is typed (hidden) when
# you start the backend, and is never saved anywhere.
# =====================================================================


# ---------------------------------------------------------------------
# 1. EMAIL (used for password reset links and for sending reports)
# ---------------------------------------------------------------------

# true = send emails, false = do not send any email
mail.enabled=true

# The address the emails come FROM (change it when you get the official one)
mail.from=himanshuthorat@sumasoft.com

# The name people see next to that address
mail.fromName=Suma Tracking

# The email server (SMTP) and its port
#   Office 365 / Outlook company mail : smtp.office365.com   port 587
#   Gmail or Google Workspace         : smtp.gmail.com       port 587
mail.host=smtp.office365.com
mail.port=587

# The user name for the email server (usually the same as mail.from)
mail.username=himanshuthorat@sumasoft.com

# The website address put into password reset links
#   Docker on this computer: http://localhost:3000
#   Without Docker:          http://localhost:5173
#   Later on a server:       https://tracking.sumasoft.com (example)
app.publicUrl=http://localhost:3000

# A reset link works for this many minutes, one time only
mail.resetLinkMinutes=30

# One email address can ask for a reset link at most this many times per hour
mail.resetMaxPerHour=3


# ---------------------------------------------------------------------
# 2. REPORTS (attendance reports)
# ---------------------------------------------------------------------

# Monthly report, sent by itself to the Project Manager and Team Leader of each project
#   true = send it, false = do not send it
reports.monthly.enabled=true

# Day of the month to send it (1 = the 1st), and the hour (0 to 23, India time)
reports.monthly.day=1
reports.monthly.hour=9

# Extra people who get EVERY monthly report (comma between emails), for example:
#   reports.monthly.alsoSendTo=rucha.kakade@sumasoft.com, ninad@sumasoft.com
reports.monthly.alsoSendTo=

# Daily report, sent by itself every evening (false = off)
reports.daily.enabled=false
reports.daily.hour=20
# Who gets the daily report (comma between emails). Empty = nobody.
reports.daily.sendTo=

# "Send report" button: the most people in To and Cc together
reports.maxRecipients=10

# Text put at the start of every report email subject
reports.subjectPrefix=[Suma Tracking]
