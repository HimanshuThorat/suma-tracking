# =====================================================================
# Suma Tracking with Docker: database + backend + website, with one command.
# Do not run "docker compose up" by hand: use the start script, it asks for the
# database password (typed hidden, never saved in any file):
#   powershell -ExecutionPolicy Bypass -File scripts\docker-start.ps1
# Website:  http://localhost:3000
# Database for pgAdmin (optional): localhost, port 55432, database suma_tracking, user suma_app
# =====================================================================
name: suma-tracking

services:
  db:
    image: postgres:17-alpine
    environment:
      # Used only the first time, to create suma_app with this password (see docker/db-init)
      POSTGRES_PASSWORD: ${SUMA_DB_PASSWORD:-}
    volumes:
      - suma-db:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U suma_app -d suma_tracking"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    image: suma-tracking-backend:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/suma_tracking
      SUMA_DB_PASSWORD: ${SUMA_DB_PASSWORD:-}
      SUMA_TRUST_PROXY: "true"
      # Used only once, by the start script, to give the first Super Admin a temporary password
      SUMA_BOOTSTRAP_ADMIN_EMAIL: ${SUMA_BOOTSTRAP_ADMIN_EMAIL:-}
      SUMA_BOOTSTRAP_ADMIN_PASSWORD: ${SUMA_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: suma-tracking-frontend:local
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

# The database files live in this Docker volume. "docker compose down" keeps it.
# Never run "docker compose down -v": that deletes all data.
volumes:
  suma-db: