# Suma Tracking website (nginx). Open http://localhost:30300
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: suma-tracking
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: suma-tracking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: suma-tracking-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
