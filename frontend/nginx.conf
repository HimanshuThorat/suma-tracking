# nginx inside the website container.
# - Serves the built React website.
# - Passes every /api call to the backend container (named "backend" in Docker and in Kubernetes).
# - Tells the backend the real IP address of the visitor (used by Attendance device checks).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Excel imports can be a few MB
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace (never add to) what the visitor sent, so nobody can fake an IP address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # The website itself: every page is index.html (the app uses #/ links)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files with a hash in the name never change, so the browser may keep them
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
